                nullable: true
                properties:
                  artifactReference:
                    description: Artifact selected for custom download or apply. Configuration changes MUST preserve it.
                    nullable: true
                    type: string
                  generation:
                    format: int64
                    type: integer
                  operation:
                    enum:
                    - apply
                    - download
                    - remove
                    type: string
                  operationId:
                    type: string
                  sessionId:
                    nullable: true
                    type: string
                  success:
                    nullable: true
                    type: boolean
                required:
                - generation
                - operation
                - operationId
                type: object
              message:
                description: Human-readable explanation of the current node state.
                nullable: true
                type: string
              observedGeneration:
                description: Spec generation reflected in this status.
                format: int64
                nullable: true
                type: integer
              phase:
                description: Observed stage of the node lifecycle.
                enum:
                - Pending
                - Running
                - Disabled
                - Failed
                - Disconnected
                - Terminating
                - null
                nullable: true
                type: string
              reportingSession:
                description: Host UID that produced this status.

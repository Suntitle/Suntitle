                    required:
                    - language
                    - model
                    type: object
                  translator:
                    description: Text translation configuration.
                    properties:
                      model:
                        description: Translation model override; null selects the provider default.
                        maxLength: 256
                        nullable: true
                        type: string
                      preserveFormatting:
                        default: true
                        description: Whether to retain input text formatting in translations.
                        type: boolean
                      provider:

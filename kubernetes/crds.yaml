apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: suntitlehosts.control.suntitle.io
spec:
  group: control.suntitle.io
  names:
    kind: SuntitleHost
    plural: suntitlehosts
    singular: suntitlehost
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SuntitleHostSpec via `CustomResource`
        properties:
          spec:
            properties:
              displayName:
                description: Display name shown for this host.
                maxLength: 128
                minLength: 1
                type: string
            required:
            - displayName
            type: object
          status:
            nullable: true
            properties:
              agentVersion:
                description: Version of the reporting host agent.
                nullable: true
                type: string
              conditions:
                description: Host health observations keyed by condition type.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              ip:
                description: IP address reported by the host agent.
                nullable: true
                type: string
              lastHeartbeat:
                description: Time of the latest host heartbeat.
                format: date-time
                nullable: true
                type: string
              presence:
                description: Observed host availability.
                enum:
                - Online
                - Offline
                - null
                nullable: true
                type: string
              reportedMetadata:
                description: Capabilities and implementation-specific data reported by the host.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              sessionId:
                description: Active host connection session ID.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: SuntitleHost
        type: object
    served: true
    storage: true
    subresources:
      status: {}

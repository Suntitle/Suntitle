                      sourceLanguage:
                        description: Language code of the input text.
                        maxLength: 3
                        pattern: ^[a-z]{2,3}$
                        type: string
                        x-kubernetes-validations:
                        - message: sourceLanguage must be a lowercase ISO 639 code
                          rule: self.matches('^[a-z]{2,3}$')
                      targetLanguage:
                        description: Language code requested for the translated text.
                        maxLength: 3
                        pattern: ^[a-z]{2,3}$
                        type: string
                        x-kubernetes-validations:
                        - message: targetLanguage must be a lowercase ISO 639 code
                          rule: self.matches('^[a-z]{2,3}$')
                    required:
                    - provider
                    - sourceLanguage
                    - targetLanguage
                    type: object
                type: object
                x-kubernetes-validations:

# Certificate CNs (users), not service accounts: no token controller required.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: suntitle-api
  namespace: suntitle
rules:
  - apiGroups: [control.suntitle.io]
    resources: [suntitlehosts]
    verbs: [get, list]
  - apiGroups: [control.suntitle.io]
    resources: [suntitlenodes, suntitleextensions]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: suntitle-proxy
  namespace: suntitle
rules:
  - apiGroups: [control.suntitle.io]
    resources: [suntitlehosts, suntitlenodes, suntitleextensions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [control.suntitle.io]
    resources: [suntitlehosts/status, suntitlenodes/status, suntitleextensions/status]
    verbs: [get, update, patch]
  - apiGroups: [control.suntitle.io]
    resources: [suntitlehosts/finalizers, suntitlenodes/finalizers]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: suntitle-api
  namespace: suntitle
subjects:
  - kind: User
    name: suntitle-api
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: suntitle-api
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: suntitle-proxy
  namespace: suntitle
subjects:
  - kind: User
    name: suntitle-proxy
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: suntitle-proxy
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: suntitle-api-readiness
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [suntitlehosts.control.suntitle.io, suntitlenodes.control.suntitle.io, suntitleextensions.control.suntitle.io]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: suntitle-api-readiness
subjects:
  - kind: User
    name: suntitle-api
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: suntitle-api-readiness
  apiGroup: rbac.authorization.k8s.io

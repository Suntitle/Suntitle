name: UI CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-ui:
    name: Lint, build, and test UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run Cypress integration tests
        run: just ui-test
        working-directory: .

      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-artifacts
          path: |
            ui/cypress/screenshots/
            ui/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7

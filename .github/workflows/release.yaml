name: Release Suntitle
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable

jobs:
  default-extensions:
    name: Publish default extension OCI payload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.publish.outputs.reference }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish default extensions
        id: publish
        run: |
          repository="ghcr.io/suntitle/suntitle/default-extensions"
          oras push "$repository:$RELEASE_TAG" \
            --artifact-type application/vnd.suntitle.extension.v1 \
            --annotation org.opencontainers.image.source=https://github.com/Suntitle/Suntitle \
            --annotation "org.opencontainers.image.version=$RELEASE_TAG" \
            default-extensions:application/vnd.oci.image.layer.v1.tar+gzip
          digest="$(oras resolve "$repository:$RELEASE_TAG")"
          printf 'reference=%s@%s\n' "$repository" "$digest" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" != *-* ]]; then
            oras tag "$repository@$digest" latest
          fi

  build-diamant:
    name: Diamant release (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            source: target/release/diamant
            asset: diamant.linux-x86_64
            rustflags: ""
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            source: target/release/diamant.exe
            asset: diamant.windows-x86_64.exe
            rustflags: -C target-feature=+crt-static
          - runner: macos-15
            target: aarch64-apple-darwin
            source: target/release/diamant
            asset: diamant.macos-aarch64
            rustflags: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            source: target/release/diamant
            asset: diamant.macos-x86_64
            rustflags: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Select Rust toolchain
        run: rustup override set "$RUST_TOOLCHAIN"
        shell: bash

      - name: Build primary Diamant executable
        run: cargo build --locked --release -p diamant --bin diamant
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Prepare release asset
        run: cp "${{ matrix.source }}" "${{ matrix.asset }}"
        shell: bash

      - name: Upload primary Diamant executable
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ matrix.asset }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          tag_name: ${{ inputs.tag || github.ref_name }}

  build-server-release-linux:
    needs: default-extensions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RUST_BACKTRACE: full
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: true
      matrix:
        target:
          - name: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build release
        timeout-minutes: 120
        run: |
          rust_image=rust:alpine
          if [ "$RUST_TOOLCHAIN" != stable ]; then
            rust_image="rust:${RUST_TOOLCHAIN}-alpine"
          fi
          docker build --platform linux/amd64 --file docker/ws-proxy/Dockerfile \
            --build-arg RUST_IMAGE="$rust_image" \
            --build-arg DEFAULT_EXTENSIONS_REFERENCE="${{ needs.default-extensions.outputs.reference }}" \
            --target release-artifacts --output type=local,dest=release-binaries .

      - name: Build component images from release binaries
        id: component-images
        run: |
          image_name="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Release tag is not a valid container tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_revision="$(git rev-parse HEAD)"
          for component in control-api ws-proxy; do
            docker build --platform linux/amd64 --file docker/ws-proxy/Dockerfile.binaries \
              --target "$component" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$RELEASE_TAG" \
              --label "org.opencontainers.image.revision=$release_revision" \
              --tag "$image_name/$component:$RELEASE_TAG" release-binaries
          done
          docker build --platform linux/amd64 --file ui/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.opencontainers.image.revision=$release_revision" \
            --tag "$image_name/ui:$RELEASE_TAG" ui
          printf 'name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          cd release-binaries
          tar -cJf ws-proxy.${{ matrix.target.name }}.tar.xz ws-proxy
          tar -cJf control-api.${{ matrix.target.name }}.tar.xz control_api

      - name: Generate checksums
        run: |
          cd release-binaries
          sha256sum ws-proxy.${{ matrix.target.name }}.tar.xz > ws-proxy.${{ matrix.target.name }}.tar.xz.sha256
          sha256sum control-api.${{ matrix.target.name }}.tar.xz > control-api.${{ matrix.target.name }}.tar.xz.sha256

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish component images
        env:
          IMAGE_NAME: ${{ steps.component-images.outputs.name }}
        run: |
          for component in control-api ws-proxy ui; do
            docker push "$IMAGE_NAME/$component:$RELEASE_TAG"
            if [[ "$RELEASE_TAG" != *-* ]]; then
              docker tag "$IMAGE_NAME/$component:$RELEASE_TAG" "$IMAGE_NAME/$component:latest"
              docker push "$IMAGE_NAME/$component:latest"
            fi
          done

      - name: Upload Github Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-binaries/*.tar.xz
            release-binaries/*.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          tag_name: ${{ inputs.tag || github.ref_name }}

  build-diamant-cli-linux:
    name: Diamant CLI release (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build pure CLI release
        timeout-minutes: 120
        run: |
          rust_image=rust:alpine
          if [ "$RUST_TOOLCHAIN" != stable ]; then
            rust_image="rust:${RUST_TOOLCHAIN}-alpine"
          fi
          docker build --platform linux/amd64 --file docker/diamant/Dockerfile \
            --build-arg RUST_IMAGE="$rust_image" \
            --target release-artifact --output type=local,dest=diamant-cli-binary .

      - name: Package CLI release
        run: |
          cd diamant-cli-binary
          tar -cJf diamant-cli.x86_64-unknown-linux-musl.tar.xz diamant
          sha256sum diamant-cli.x86_64-unknown-linux-musl.tar.xz > diamant-cli.x86_64-unknown-linux-musl.tar.xz.sha256

      - name: Build CLI container image
        id: cli-image
        run: |
          image_name="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/diamant"
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Release tag is not a valid container tag: $RELEASE_TAG" >&2
            exit 1
          fi
          rust_image=rust:alpine
          if [ "$RUST_TOOLCHAIN" != stable ]; then
            rust_image="rust:${RUST_TOOLCHAIN}-alpine"
          fi
          docker build --platform linux/amd64 --file docker/diamant/Dockerfile \
            --build-arg RUST_IMAGE="$rust_image" \
            --target runtime \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --tag "$image_name:$RELEASE_TAG" .
          printf 'name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish CLI container image
        env:
          IMAGE_NAME: ${{ steps.cli-image.outputs.name }}
        run: |
          docker push "$IMAGE_NAME:$RELEASE_TAG"
          if [[ "$RELEASE_TAG" != *-* ]]; then
            docker tag "$IMAGE_NAME:$RELEASE_TAG" "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:latest"
          fi

      - name: Upload CLI release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            diamant-cli-binary/*.tar.xz
            diamant-cli-binary/*.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          tag_name: ${{ inputs.tag || github.ref_name }}

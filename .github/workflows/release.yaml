name: Release Suntitle
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable

jobs:
  build-release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RUST_BACKTRACE: full
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: true
      matrix:
        target:
          - name: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build release
        timeout-minutes: 120
        run: |
          rust_image=rust:alpine
          if [ "$RUST_TOOLCHAIN" != stable ]; then
            rust_image="rust:${RUST_TOOLCHAIN}-alpine"
          fi
          docker build --platform linux/amd64 --file docker/ws-proxy/Dockerfile \
            --build-arg RUST_IMAGE="$rust_image" \
            --target release-artifacts --output type=local,dest=release-binaries .

      - name: Build runtime image from release binaries
        id: runtime-image
        run: |
          image_name="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Release tag is not a valid container tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_revision="$(git rev-parse HEAD)"
          docker build --platform linux/amd64 --file docker/ws-proxy/Dockerfile.binaries \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.opencontainers.image.revision=$release_revision" \
            --tag "$image_name:$RELEASE_TAG" release-binaries
          printf 'name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          cd release-binaries
          tar -cJf ws-proxy.${{ matrix.target.name }}.tar.xz ws-proxy
          tar -cJf control-api.${{ matrix.target.name }}.tar.xz control_api
          tar -cJf diamant.${{ matrix.target.name }}.tar.xz diamant

      - name: Generate checksums
        run: |
          cd release-binaries
          sha256sum ws-proxy.${{ matrix.target.name }}.tar.xz > ws-proxy.${{ matrix.target.name }}.tar.xz.sha256
          sha256sum control-api.${{ matrix.target.name }}.tar.xz > control-api.${{ matrix.target.name }}.tar.xz.sha256
          sha256sum diamant.${{ matrix.target.name }}.tar.xz > diamant.${{ matrix.target.name }}.tar.xz.sha256

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish runtime image
        env:
          IMAGE_NAME: ${{ steps.runtime-image.outputs.name }}
        run: |
          docker push "$IMAGE_NAME:$RELEASE_TAG"
          if [[ "$RELEASE_TAG" != *-* ]]; then
            docker tag "$IMAGE_NAME:$RELEASE_TAG" "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:latest"
          fi

      - name: Upload Github Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-binaries/*.tar.xz
            release-binaries/*.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          tag_name: ${{ inputs.tag || github.ref_name }}

- name: native
  runtime: executable
  entry: bin/probe
- name: python-script
  runtime: python
  entry: probe.py
- name: python-module
  runtime: pythonModule
  entry: probe_module/__main__.py
- name: oci-native
  runtime: executable
  entry: bin/probe
  seedFrom: native
- name: oci-python-script
  runtime: python
  entry: probe.py
  seedFrom: python-script
  expectations: override-expectations.yaml
- name: oci-python-module
  runtime: pythonModule
  entry: probe_module/__main__.py
  seedFrom: python-module
- name: custom
  runtime: python
  entry: probe.py
  expectations: custom-expectations.yaml

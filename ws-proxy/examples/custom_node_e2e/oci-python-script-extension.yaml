name: oci-python-script-probe
displayName: OCI python-script probe
sourceType: oci
source: "${REGISTRY}/custom-node-sources/${HOST_NAME}/python-script:fixture"
adapter:
  inputType: text
  outputType: text
  execution:
    runtime: python
    command: ./probe.py
  settings:
    endpoint:
      default: transcribe
    label:
      default: default label
    message:
      default: overridden by node
    report:
      required: true
    finish:
      required: true
  arguments:
    - flag: --server
      url:
        base: runtime.websocketUrl
        path: settings.endpoint
    - flag: --label
      source: settings.label
    - flag: --message
      source: settings.message
    - flag: --report
      source: settings.report
    - flag: --finish
      source: settings.finish

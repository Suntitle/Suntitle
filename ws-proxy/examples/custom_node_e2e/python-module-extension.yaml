name: python-module-probe
displayName: python-module probe
sourceType: local
source: "${SOURCE_ROOT}/python-module"
adapter:
  nodeRole: transcriber
  execution:
    runtime: pythonModule
    command: probe_module
  settings:
    label:
      default: default label
    message:
      default: overridden by node
    report:
      required: true
    finish:
      required: true
  arguments:
    - flag: --server
      source: runtime.websocketUrl
    - flag: --label
      source: settings.label
    - flag: --message
      source: settings.message
    - flag: --report
      source: settings.report
    - flag: --finish
      source: settings.finish

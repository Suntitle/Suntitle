name: native-probe
displayName: native probe
sourceType: local
source: "${SOURCE_ROOT}/native"
adapter:
  type: transcriber
  execution:
    runtime: executable
    command: ./bin/probe
  settings:
    label:
      default: default label
    message:
      default: overridden by node
    report:
      required: true
    finish:
      required: true
  arguments:
    - flag: --server
      source: runtime.websocketUrl
    - flag: --label
      source: settings.label
    - flag: --message
      source: settings.message
    - flag: --report
      source: settings.report
    - flag: --finish
      source: settings.finish

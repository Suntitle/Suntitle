name: custom-probe
displayName: custom probe
sourceType: local
source: "${SOURCE_ROOT}/python-script"
adapter:
  outputType: image
  execution:
    runtime: python
    command: ./probe.py
  settings:
    endpoint:
      default: transcribe
    enabled:
      default: true
    quiet:
      default: false
    label:
      default: default label
    message:
      default: overridden by node
    report:
      required: true
    finish:
      required: true
  arguments:
    - flag: --server
      url:
        base: runtime.websocketUrl
        path: settings.endpoint
    - flag: --enabled
      source: settings.enabled
      mode: flag
    - flag: --quiet
      source: settings.quiet
      mode: flag
    - flag: --label
      source: settings.label
    - flag: --message
      source: settings.message
    - flag: --report
      source: settings.report
    - flag: --finish
      source: settings.finish

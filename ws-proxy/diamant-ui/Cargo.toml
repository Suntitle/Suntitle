[package]
name = "diamant-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

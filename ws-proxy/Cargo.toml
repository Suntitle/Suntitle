[package]
name = "ws-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[[example]]
name = "custom_node_probe"
path = "examples/custom_node_e2e/extensions/native/main.rs"

[features]
default = []
gui = ["dep:diamant-ui"]

[dependencies]
apalis = { version = "=1.0.0", default-features = false, features = ["limit", "catch-panic"] }
apalis-sqlite = "=1.0.0"
gix = { version = "=0.87.1", default-features = false, features = ["sha1", "blocking-http-transport-reqwest-rust-tls"] }
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
tokio-util = { version = "0.7", features = ["io", "io-util", "rt"] }
tar = "0.4"
flate2 = "1"
oci-artifact = { path = "../oci-artifact" }
dirs = "6"
tempfile = "3"
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "derive", "runtime", "unstable-runtime", "cel"] }
k8s-openapi = { version = "0.28", features = ["v1_36", "schemars"] }
schemars = { version = "1", features = ["chrono04"] }
uv  = "0.12.10"
actix-web = "4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
diamant-ui = { path = "diamant-ui", optional = true }
futures-util = "0.3.31"
hostname = "0.4"
ctrlc = { version = "3", features = ["termination"] }
nix = { version = "0.30", features = ["signal", "process"] }
pretty_env_logger = "0.5.0"
rootcause = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "4.2"
serde_yaml = "0.9"
tokio = { version = "1.47.1", features = ["full"]}
tokio-stream = "0.1.17"
tokio-tungstenite = "0.27.0"
utoipa = { version = "5", features = ["actix_extras", "chrono", "uuid", "yaml"] }
utoipa-actix-web = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
validator = { version = "0.20", features = ["derive"] }
warp = { version = "0.4.2", features = ["websocket", "server"] }
clap_reverse = "0.1.1"

[dev-dependencies]
warp = { version = "0.4.2", features = ["websocket", "server", "test"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

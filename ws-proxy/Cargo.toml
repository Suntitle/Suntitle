[package]
name = "ws-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3.31"
hostname = "0.4"
ctrlc = { version = "3", features = ["termination"] }
nix = { version = "0.30", features = ["signal", "process"] }
pretty_env_logger = "0.5.0"
rootcause = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.47.1", features = ["full"]}
tokio-stream = "0.1.17"
tokio-tungstenite = "0.27.0"
utoipa = { version = "5", features = ["actix_extras", "chrono", "uuid", "yaml"] }
utoipa-actix-web = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
validator = { version = "0.20", features = ["derive"] }
warp = { version = "0.4.2", features = ["websocket", "server"] }
clap_reverse = "0.1.1"

async-trait = "0.1"
dotenvy = "0.15"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "chrono", "migrate", "macros"] }
sea-query = "0.32.7"
sea-query-binder = { version = "0.7.0", features = ["sqlx-postgres", "with-uuid", "with-json"] }

[dev-dependencies]
warp = { version = "0.4.2", features = ["websocket", "server", "test"] }

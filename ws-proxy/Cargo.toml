[package]
name = "ws-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.31"
pretty_env_logger = "0.5.0"
tokio = { version = "1.47.1", features = ["full"]}
tokio-stream = "0.1.17"
tokio-tungstenite = "0.27.0"
warp = { version = "0.4.2", features = ["websocket", "server"] }

[dev-dependencies]
warp = { version = "0.4.2", features = ["websocket", "server", "test"] }
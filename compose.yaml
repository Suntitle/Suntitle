name: suntitle
services:
  traefik:
    image: "traefik:v3.6"
    container_name: "traefik"
    restart: unless-stopped
    depends_on:
      distribution:
        condition: service_healthy
      api:
        condition: service_healthy
      ws-proxy:
        condition: service_healthy
      ui:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
      # Traefik MUST access the host Docker socket for service discovery.
      - label:disable
    networks:
      control-plane:
        aliases:
          - ${REGISTRY_HOST:-registry.localhost}
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
  distribution:
    image: registry:3
    restart: unless-stopped
    environment:
      OTEL_TRACES_EXPORTER: none
    volumes:
      - registry-data:/var/lib/registry
      - ./docker/distribution/config.yml:/etc/distribution/config.yml:ro,z
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.distribution.rule=Host(`${REGISTRY_HOST:-registry.localhost}`)"
      - "traefik.http.routers.distribution.entrypoints=web"
      - "traefik.http.routers.distribution.priority=200"
      - "traefik.http.services.distribution.loadbalancer.server.port=5000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - control-plane

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suntitle}
      POSTGRES_USER: ${POSTGRES_USER:-suntitle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suntitle-local}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - control-plane

  kine:
    image: ghcr.io/k3s-io/kine:v0.17.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      # The image entrypoint is /bin/kine; pass only flags here.
      - --endpoint=postgres://${POSTGRES_USER:-suntitle}:${POSTGRES_PASSWORD:-suntitle-local}@postgres:5432/${POSTGRES_DB:-suntitle}?sslmode=disable
      - --listen-address=tcp://0.0.0.0:2379
    networks:
      - control-plane

  kube-apiserver:
    image: registry.k8s.io/kube-apiserver:v1.37.0
    restart: unless-stopped
    depends_on:
      - kine
    command:
      - kube-apiserver
      - --secure-port=6443
      - --bind-address=0.0.0.0
      - --advertise-address=${APISERVER_ADVERTISE_ADDRESS:-127.0.0.1}
      - --etcd-servers=http://kine:2379
      - --tls-cert-file=/etc/kubernetes/pki/apiserver.crt
      - --tls-private-key-file=/etc/kubernetes/pki/apiserver.key
      - --client-ca-file=/etc/kubernetes/pki/ca.crt
      - --service-account-key-file=/etc/kubernetes/pki/sa.pub
      - --service-account-signing-key-file=/etc/kubernetes/pki/sa.key
      - --service-account-issuer=https://kubernetes.default.svc
      - --service-cluster-ip-range=${SERVICE_CIDR:-10.96.0.0/12}
      - --authorization-mode=Node,RBAC
      - --enable-bootstrap-token-auth=true
      - --endpoint-reconciler-type=none
    volumes:
      - ./pki:/etc/kubernetes/pki:ro,z
    networks:
      - control-plane

  kubernetes-bootstrap:
    build:
      context: .
      dockerfile: docker/ws-proxy/Dockerfile
      target: control-api
    image: suntitle-control-api:local
    depends_on:
      kube-apiserver:
        condition: service_started
    volumes:
      - ./pki:/etc/kubernetes/pki:ro,z
    command:
      - /bin/bash
      - -ec
      - |
        for attempt in {1..90}; do
          if curl -fsS --max-time 2 --cacert /etc/kubernetes/pki/ca.crt --cert /etc/kubernetes/pki/admin.crt --key /etc/kubernetes/pki/admin.key https://kube-apiserver:6443/readyz >/dev/null 2>&1; then
            exec control_api bootstrap-kubernetes --kubeconfig /etc/kubernetes/pki/admin.compose.kubeconfig --namespace suntitle
          fi
          sleep 1
        done
        echo "Kubernetes API did not become ready." >&2
        exit 1
    networks:
      - control-plane

  api:
    image: suntitle-control-api:local
    restart: unless-stopped
    depends_on:
      kubernetes-bootstrap:
        condition: service_completed_successfully
    command: [control_api, --kubeconfig, /etc/kubernetes/pki/suntitle-api.compose.kubeconfig, --namespace, suntitle]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-suntitle}:${POSTGRES_PASSWORD:-suntitle-local}@postgres:5432/${POSTGRES_DB:-suntitle}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./pki:/etc/kubernetes/pki:ro,z
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.services.api.loadbalancer.server.port=3031"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:3031/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - control-plane

  ui:
    build:
      context: ./ui
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:3031
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ui.entrypoints=web"
      - "traefik.http.routers.ui.priority=1"
      - "traefik.http.services.ui.loadbalancer.server.port=5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - control-plane

  ws-proxy:
    build:
      context: .
      dockerfile: docker/ws-proxy/Dockerfile
      target: ws-proxy
      args:
        DEFAULT_EXTENSIONS_REFERENCE: ${DEFAULT_EXTENSIONS_REFERENCE:-ghcr.io/suntitle/suntitle/default-extensions:latest}
    image: suntitle-ws-proxy:local
    restart: unless-stopped
    environment:
      EXTENSION_REGISTRY: ${REGISTRY_HOST:-registry.localhost}/suntitle/extensions
      EXTENSION_REGISTRY_PLAIN_HTTP: "true"
      DEFAULT_EXTENSIONS_REFERENCE: ${DEFAULT_EXTENSIONS_REFERENCE:-}
    depends_on:
      kubernetes-bootstrap:
        condition: service_completed_successfully
    command: [ws-proxy, --kubeconfig, /etc/kubernetes/pki/suntitle-proxy.compose.kubeconfig, --namespace, suntitle]
    volumes:
      - ./pki:/etc/kubernetes/pki:ro,z
      # Developers' local extension sources. Override the host directory in .env.local.
      - ${LOCAL_EXTENSIONS_DIR:-./extensions}:/opt/suntitle/extensions:ro,z
      # Bundled E2E fixtures, also available for manual development testing.
      - ./ws-proxy/examples/custom_node_e2e/extensions:/opt/suntitle/example-extensions:ro,z
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ws-proxy.rule=Path(`/register`) || Path(`/transcribe`) || Path(`/translate`) || Path(`/display`) || (Path(`/`) && Header(`Upgrade`, `websocket`) && !Header(`Sec-WebSocket-Protocol`, `vite-hmr`))"
      - "traefik.http.routers.ws-proxy.entrypoints=web"
      - "traefik.http.routers.ws-proxy.priority=50"
      - "traefik.http.services.ws-proxy.loadbalancer.server.port=3030"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3030"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - control-plane

volumes:
  postgres-data:
  registry-data:

networks:
  control-plane:
    driver: bridge

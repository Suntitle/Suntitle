openapi: 3.1.0
info:
  title: Suntitle Control API
  description: Resource-oriented control API. Successful writes persist desired state; runtime application is asynchronous. Kubernetes schema/CEL validate specs; API-server errors preserve their HTTP status, reason, message, and details.
  version: 0.1.0
servers:
- url: /api/v1
  description: API version 1
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Log in
      description: Exchange user credentials for a bearer access token.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out
      description: Revoke the bearer token used for this request.
      operationId: logout
      responses:
        '204':
          description: Logout successful.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Get the authenticated user
      description: Validates the bearer token and returns its user. A missing, expired, revoked, or otherwise invalid token returns `401 Unauthorized`.
      operationId: getCurrentUser
      responses:
        '200':
          description: The bearer token is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /extensions:
    get:
      tags:
      - Extensions
      summary: List registered extensions
      operationId: listExtensions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_Extension'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
      - Extensions
      summary: Register an extension
      description: Register from a source manifest or an explicit specification. OCI source registration requires separate manifest YAML/JSON contents. The backend controller reads or parses the manifest asynchronously and reports resolution or preparation failures in status. Publication and host installation remain asynchronous.
      operationId: createExtension
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionCreateRequest'
        required: true
      responses:
        '201':
          headers:
            Location:
              schema:
                type: string
              description: Created extension URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extension'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /extensions/{name}:
    get:
      tags:
      - Extensions
      summary: Read one extension by its stable URL identity.
      operationId: getExtension
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extension'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags:
      - Extensions
      summary: Request removal; the controller retains terminating resources until dependent nodes finish cleanup.
      description: Request asynchronous removal of the extension and its dependent nodes. Terminating extensions remain visible until cleanup completes, including while a host is offline.
      operationId: deleteExtension
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Removal requested
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /extensions/{name}/refresh:
    post:
      tags:
      - Extensions
      summary: Request extension preparation from its source
      description: Persist a fresh refresh token. Preparation is asynchronous; pending requests may coalesce. Stored publication status may describe an earlier configuration.
      operationId: refreshExtension
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extension'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /hosts:
    get:
      tags:
      - Hosts
      summary: List flat resources with the collection revision.
      operationId: listHosts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_Host'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /hosts/{name}/nodes:
    post:
      tags:
      - Nodes
      summary: Persist a node assigned to the host selected by resource name.
      description: Persist desired state with host ownership. The path selects the host by resource name. Success does not imply runtime execution.
      operationId: installNodeOnHost
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreate'
        required: true
      responses:
        '201':
          headers:
            Location:
              schema:
                type: string
              description: Created resource URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /node-types:
    get:
      tags:
      - Node types
      summary: List installable node types
      description: Returns the node types supported by the control plane and the field metadata needed to configure their type-specific settings.
      operationId: listNodeTypes
      responses:
        '200':
          description: Installable node types and their setting definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeTypeDefinitionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /nodes:
    get:
      tags:
      - Nodes
      summary: List flat resources with the collection revision.
      operationId: listNodes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_Node'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /nodes/{name}:
    get:
      tags:
      - Nodes
      summary: Read the named node and its resource status.
      operationId: getNode
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags:
      - Nodes
      summary: Persist flat desired configuration; runtime application is asynchronous.
      description: Persist a complete desired spec without a resourceVersion precondition. Status is preserved. Success does not imply runtime application.
      operationId: updateNode
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags:
      - Nodes
      description: Request asynchronous removal. Terminating resources remain visible until runtime cleanup is acknowledged, including while the host is offline.
      operationId: deleteNode
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Deletion requested
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /nodes/{name}/restart:
    post:
      tags:
      - Nodes
      summary: Request a restart and return the resource status unchanged.
      description: Persist a fresh restart token. Runtime completion is asynchronous; pending requests may coalesce.
      operationId: restartNode
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    AudioSourceSettings:
      type: object
      required:
      - sampleRateHz
      - channels
      - encoding
      properties:
        channels:
          type: integer
          format: int32
          description: Number of audio channels captured.
          maximum: 2
          minimum: 1
        deviceName:
          type:
          - string
          - 'null'
          description: Audio capture device; null selects the runtime default.
          maxLength: 256
        encoding:
          allOf:
          - type: string
            enum:
            - pcm_s16le
            - pcm_f32le
            - opus
          - type: object
            description: Format used to encode captured audio.
        sampleRateHz:
          type: integer
          enum:
          - 8000
          - 16000
          - 22050
          - 44100
          - 48000
      additionalProperties: false
    DisplaySettings:
      type: object
      required:
      - maxLines
      - fontScale
      - showOriginal
      properties:
        fontScale:
          type: number
          format: double
          description: Multiplier applied to the default subtitle font size.
          maximum: 4
          minimum: 0.5
        maxLines:
          type: integer
          format: int32
          description: Maximum number of subtitle lines displayed at once.
          maximum: 10
          minimum: 1
        showOriginal:
          type: boolean
          description: Whether to show source text alongside its translation.
        theme:
          allOf:
          - type: string
            enum:
            - light
            - dark
            - transparent
          - type: object
            description: Color and background style used for subtitles.
            default: dark
      additionalProperties: false
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        details: {}
        message:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    Extension:
      allOf:
      - $ref: '#/components/schemas/SuntitleExtensionSpec'
        description: Desired source and adapter fields exposed at the response's top level.
      - type: object
        required:
        - name
        properties:
          deleting:
            type: boolean
            description: True while controller-owned dependent-node cleanup is pending.
          name:
            type: string
            description: Stable URL identity, independent of the display name.
          status:
            oneOf:
            - $ref: '#/components/schemas/ExtensionStatus'
              description: Deferred publication progress or terminal outcome; never host installation state.
            - type: 'null'
      description: Public extension configuration and publication state without Kubernetes envelopes.
    ExtensionCreate:
      allOf:
      - $ref: '#/components/schemas/SuntitleExtensionSpec'
        description: Desired source and adapter fields serialized at the request's top level.
      - type: object
        properties:
          name:
            type:
            - string
            - 'null'
            description: Optional URL identity. The server generates an identifier when omitted.
      description: Flat registration contract. Persistence wraps configuration in a Kubernetes spec.
    ExtensionCreateRequest:
      oneOf:
      - $ref: '#/components/schemas/ExtensionRegistration'
        description: Persist the source for asynchronous controller-owned manifest resolution.
      - $ref: '#/components/schemas/ExtensionCreate'
        description: Accept complete configuration directly as flat request fields.
      description: Registration accepts a source manifest or an explicit extension specification.
    ExtensionRegistration:
      type: object
      description: Registration location; all adapter fields come from the source manifest.
      required:
      - sourceType
      - source
      properties:
        manifest:
          type:
          - string
          - 'null'
          description: YAML or JSON manifest contents. Required for source-only OCI registration.
          maxLength: 1048576
          minLength: 1
        source:
          type: string
          description: Absolute controller directory, HTTP(S) Git URL, OCI reference, or HTTP payload URL.
          minLength: 1
        sourceType:
          $ref: '#/components/schemas/ExtensionSourceType'
          description: Transport used to read and subsequently publish the extension.
      additionalProperties: false
    ExtensionSourceType:
      type: string
      description: Transport used to discover and publish extension payloads.
      enum:
      - local
      - git
      - oci
      - http
    ExtensionStatus:
      type: object
      title: ExtensionStatus
      description: Publication progress and terminal outcome reported by Apalis for the observed revision.
      properties:
        artifactReference:
          type:
          - string
          - 'null'
          description: Verified digest reference available after successful publication.
        attempts:
          type:
          - integer
          - 'null'
          format: uint
          description: Total attempts reported by Apalis once this publication completes.
          minimum: 0
        conditions:
          type: array
          items:
            type: object
            description: Condition contains details for one aspect of the current state of this API Resource.
            required:
            - lastTransitionTime
            - message
            - reason
            - status
            - type
            properties:
              lastTransitionTime:
                type: string
                format: date-time
                description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
              message:
                type: string
                description: message is a human readable message indicating details about the transition. This may be an empty string.
              observedGeneration:
                type: integer
                format: int64
                description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
              reason:
                type: string
                description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
              status:
                type: string
                description: status of the condition, one of True, False, Unknown.
              type:
                type: string
                description: type of condition in CamelCase or in foo.example.com/CamelCase.
          description: Preparing, published, or terminal failure state; retries are owned by Apalis.
          x-kubernetes-list-map-keys:
          - type
          x-kubernetes-list-type: map
        observedGeneration:
          type:
          - integer
          - 'null'
          format: int64
          description: Resource generation whose publication state is reported.
        resolvedSpec:
          type:
          - object
          - 'null'
          description: Manifest configuration used by the successful publication of this generation.
          required:
          - displayName
          - sourceType
          - source
          properties:
            adapter:
              type:
              - object
              - 'null'
              description: Explicit execution contract. Omission delegates manifest resolution to the controller.
              required:
              - execution
              properties:
                arguments:
                  type: array
                  items:
                    type: object
                    description: Ordered CLI binding reused before and after node setting resolution.
                    properties:
                      flag:
                        type:
                        - string
                        - 'null'
                        description: Omit the flag for a positional value.
                        minLength: 1
                      mode:
                        oneOf:
                        - type: string
                          description: Emit a scalar value with an optional flag.
                          enum:
                          - value
                        - type: string
                          description: Emit only the flag when its boolean source is true.
                          enum:
                          - flag
                        description: Convert to a scalar value or boolean flag. URLs MUST use value mode.
                        default: value
                    x-kubernetes-validations:
                    - message: flag mode requires a flag
                      rule: '!has(self.mode) || self.mode != ''flag'' || has(self.flag)'
                    - message: url arguments require value mode
                      rule: '!has(self.url) || !has(self.mode) || self.mode == ''value'''
                  description: Ordered mappings from typed sources to command arguments.
                execution:
                  type: object
                  description: Typed execution contract, unchanged by plugin setting resolution.
                  required:
                  - command
                  properties:
                    command:
                      type: string
                      description: One executable/script path or module name, interpreted by runtime.
                      minLength: 1
                    runtime:
                      type: string
                      description: Defaults once during deserialization and Kubernetes schema defaulting.
                      default: executable
                      enum:
                      - executable
                      - python
                      - pythonModule
                    workingDirectory:
                      type:
                      - string
                      - 'null'
                      description: Optional process directory, relative to the installed root or explicitly absolute.
                      minLength: 1
                  additionalProperties: false
                inputType:
                  oneOf:
                  - type: string
                    description: Image content.
                    enum:
                    - image
                  - type: string
                    description: Text content.
                    enum:
                    - text
                  - type: string
                    description: Audio content.
                    enum:
                    - audio
                  description: Optional input media type. Omission means no declared input, without selecting runtime behavior.
                outputType:
                  oneOf:
                  - type: string
                    description: Image content.
                    enum:
                    - image
                  - type: string
                    description: Text content.
                    enum:
                    - text
                  - type: string
                    description: Audio content.
                    enum:
                    - audio
                  description: Optional output media type. Omission means no declared output, without selecting runtime behavior.
                settings:
                  type: object
                  description: User-defined setting declarations or resolved instance values.
                  additionalProperties:
                    type: object
                    description: One plugin setting declaration. Values may have any user-defined JSON shape.
                    properties:
                      default:
                        type:
                        - 'null'
                        - boolean
                        - object
                        - array
                        - number
                        - string
                        description: Explicit null MUST remain distinct from an omitted default.
                      required:
                        type: boolean
                        description: Require an instance value when no default is declared.
                        default: false
                    additionalProperties: false
              additionalProperties: false
            displayName:
              type: string
              description: Display name of the extension.
              maxLength: 128
              minLength: 1
            manifest:
              type:
              - string
              - 'null'
              description: Separate YAML or JSON configuration for OCI binaries; parsed by the controller.
              maxLength: 1048576
              minLength: 1
            maxAttempts:
              type: integer
              format: uint32
              description: Maximum total publication attempts, including the initial execution. Defaults to three.
              default: 3
              minimum: 1
            refreshToken:
              type:
              - string
              - 'null'

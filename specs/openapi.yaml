openapi: 3.1.0
info:
  title: Suntitle Control API
  description: |
    API for authenticating operators and managing hosts and nodes in the live
    subtitle pipeline. Connection topology is represented by the `connections`
    field of each node; there is intentionally no separate routes resource.
  version: 0.1.0
servers:
- url: /api/v1
  description: API version 1
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Log in
      description: Exchange user credentials for a bearer access token.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out
      description: Revoke the bearer token used for this request.
      operationId: logout
      responses:
        '204':
          description: Logout successful.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Get the authenticated user
      description: Validates the bearer token and returns its user. A missing, expired, revoked, or otherwise invalid token returns `401 Unauthorized`.
      operationId: getCurrentUser
      responses:
        '200':
          description: The bearer token is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /hosts:
    get:
      tags:
      - Hosts
      summary: List hosts
      description: Returns hosts running one or more pipeline nodes, including their IP and software version.
      operationId: listHosts
      parameters:
      - name: status
        in: query
        description: Return only hosts with this status.
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HostStatus'
      responses:
        '200':
          description: Known hosts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /hosts/{hostId}/nodes:
    post:
      tags:
      - Nodes
      summary: Install a node on a host
      description: Installs a configured pipeline node on the selected host. The request `type` and `settings` must match one of the definitions returned by `GET /node-types`.
      operationId: installNodeOnHost
      parameters:
      - name: hostId
        in: path
        description: Host that should install and run the node.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreate'
        required: true
      responses:
        '201':
          description: Node installation was accepted and the node was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /node-types:
    get:
      tags:
      - Node types
      summary: List installable node types
      description: Returns the node types supported by the control plane and the field metadata needed to configure their type-specific settings.
      operationId: listNodeTypes
      responses:
        '200':
          description: Installable node types and their setting definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeTypeDefinitionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /nodes:
    get:
      tags:
      - Nodes
      summary: List connected nodes and their connections
      description: Returns nodes currently known by the backend. Each node includes its type, nested host, type-specific settings, and links to peer nodes.
      operationId: listNodes
      parameters:
      - name: type
        in: query
        description: Return only nodes of this type.
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NodeType'
      - name: status
        in: query
        description: Return only nodes with this status.
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NodeStatus'
      responses:
        '200':
          description: Nodes and their connection topology.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /nodes/{nodeId}:
    get:
      tags:
      - Nodes
      summary: Get a node
      operationId: getNode
      parameters:
      - name: nodeId
        in: path
        description: Unique node identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Node details and connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Nodes
      summary: Replace editable node information and settings
      description: Replaces operator-managed fields. The request `type` and `settings` must match the node's existing type. `inputNodeId` selects an upstream node whose type is allowed by the node type's `inputTypes`. ID, type, host, status, outgoing connection topology, and timestamps are server-managed.
      operationId: updateNode
      parameters:
      - name: nodeId
        in: path
        description: Unique node identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdate'
        required: true
      responses:
        '200':
          description: Updated node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request type conflicts with the existing node type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /nodes/{nodeId}/restart:
    post:
      tags:
      - Nodes
      summary: Restart a node
      description: Restarts the selected node while preserving its configuration and connections.
      operationId: restartNode
      parameters:
      - name: nodeId
        in: path
        description: Unique node identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Restarted node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The node cannot be restarted in its current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    AudioSourceNode:
      allOf:
      - $ref: '#/components/schemas/NodeBase'
        description: Common node identity, configuration, and runtime state.
      - type: object
        required:
        - settings
        properties:
          settings:
            $ref: '#/components/schemas/AudioSourceSettings'
            description: Configuration for this node type.
    AudioSourceSettings:
      type: object
      required:
      - sampleRateHz
      - channels
      - encoding
      properties:
        channels:
          type: integer
          format: int32
          description: Number of audio channels captured.
          maximum: 2
          minimum: 1
        deviceName:
          type:
          - string
          - 'null'
          description: Audio capture device; null selects the runtime default.
          maxLength: 256
        encoding:
          oneOf:
          - type: string
            enum:
            - pcm_s16le
            - pcm_f32le
            - opus
          description: Format used to encode captured audio.
        sampleRateHz:
          type: integer
          enum:
          - 8000
          - 16000
          - 22050
          - 44100
          - 48000
      additionalProperties: false
    ConnectionStatus:
      type: string
      enum:
      - connected
      - reconnecting
      - degraded
    DataType:
      type: string
      description: Type of data transferred over a node connection.
      enum:
      - audio
      - transcription
      - translation
    DisplayNode:
      allOf:
      - $ref: '#/components/schemas/NodeBase'
        description: Common node identity, configuration, and runtime state.
      - type: object
        required:
        - settings
        properties:
          settings:
            $ref: '#/components/schemas/DisplaySettings'
            description: Configuration for this node type.
    DisplaySettings:
      type: object
      required:
      - maxLines
      - fontScale
      - showOriginal
      properties:
        fontScale:
          type: number
          format: double
          description: Multiplier applied to the default subtitle font size.
          maximum: 4
          minimum: 0.5
        maxLines:
          type: integer
          format: int32
          description: Maximum number of subtitle lines displayed at once.
          maximum: 10
          minimum: 1
        showOriginal:
          type: boolean
          description: Whether to show source text alongside its translation.
        theme:
          oneOf:
          - type: string
            enum:
            - light
            - dark
            - transparent
          description: Color and background style used for subtitles.
          default: dark
      additionalProperties: false
    Host:
      type: object
      required:
      - id
      - name
      - ip
      - version
      - status
      - lastSeenAt
      properties:
        id:
          type: string
          format: uuid
          description: Stable identifier of the host.
        ip:
          type: string
          format: ip
          description: IP address of the host.
          examples:
          - 192.0.2.10
          - 2001:db8::10
        lastSeenAt:
          type: string
          format: date-time
          description: Time the host was last observed by the control plane.
        metadata:
          type: object
          description: Optional host capabilities or implementation-specific information.
          additionalProperties: true
        name:
          type: string
          description: Display name shown for this host.
          maxLength: 128
          minLength: 1
        status:
          $ref: '#/components/schemas/HostStatus'
          description: Current host availability and health.
        version:
          type: string
          description: Version of the Suntitle host agent or runtime.
          examples:
          - 0.1.0
          minLength: 1
      additionalProperties: false
    HostList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Host'
          description: Hosts returned by the query.
        total:
          type: integer
          format: int64
          description: Total number of matching hosts.
          minimum: 0
      additionalProperties: false
    HostStatus:
      type: string
      enum:
      - online
      - offline
      - degraded
    LanguageTag:
      type: string
      description: BCP 47 language tag.
      examples:
      - en
      - en-US
      pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
          format: password
          maxLength: 1024
          minLength: 1
        username:
          type: string
          maxLength: 128
          minLength: 1
      additionalProperties: false
    LoginResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
          description: Value to use with the `Authorization` header.
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds.
          minimum: 1
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'
      additionalProperties: false
    Node:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/AudioSourceNode'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - audio_source
      - allOf:
        - $ref: '#/components/schemas/TranscriberNode'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - transcriber
      - allOf:
        - $ref: '#/components/schemas/TranslatorNode'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - translator
      - allOf:
        - $ref: '#/components/schemas/DisplayNode'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - display
    NodeBase:
      type: object
      required:
      - id
      - name
      - enabled
      - status
      - host
      - connections
      - createdAt
      - updatedAt
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/NodeConnection'
          description: Observed data connections to peer nodes.
        createdAt:
          type: string
          format: date-time
          description: Time the node was created.
          readOnly: true
        description:
          type:
          - string
          - 'null'
          description: Optional description of the node’s purpose.
          maxLength: 1000
        enabled:
          type: boolean
          description: Whether the node should run.
        host:
          $ref: '#/components/schemas/Host'
          description: Host assigned to run this node.
        id:
          type: string
          format: uuid
          description: Stable identifier of the node.
          readOnly: true
        name:
          type: string
          description: Display name shown to users.
          maxLength: 128
          minLength: 1
        status:
          $ref: '#/components/schemas/NodeStatus'
          description: Current node connectivity and health.
        updatedAt:
          type: string
          format: date-time
          description: Time the node record was last updated.
          readOnly: true
    NodeConnection:
      type: object
      required:
      - id
      - peerNodeId
      - peerNodeType
      - direction
      - dataType
      - status
      - protocol
      - connectedAt
      - lastActivityAt
      properties:
        bytesTransferred:
          type: integer
          format: int64
          description: Reported number of bytes transferred over the connection.
          minimum: 0
        connectedAt:
          type: string
          format: date-time
          description: Time the connection was established.
        dataType:
          $ref: '#/components/schemas/DataType'
          description: Kind of payload carried by the connection.
        direction:
          oneOf:
          - type: string
            enum:
            - incoming
            - outgoing
          description: Direction of data flow relative to this node.
        id:
          type: string
          format: uuid
          description: Stable identifier of this connection.
        lastActivityAt:
          type: string
          format: date-time
          description: Time data was last observed on the connection.
        metadata:
          type: object
          description: Optional implementation-specific connection information.
          additionalProperties: true
        peerName:
          type: string
          description: Display name of the peer node, when known.
        peerNodeId:
          type: string
          format: uuid
          description: Identifier of the node at the other end of the connection.
        peerNodeType:
          $ref: '#/components/schemas/NodeType'
          description: Processing role of the peer node.
        protocol:
          oneOf:
          - type: string
            enum:
            - websocket
            - http
            - https
          description: Transport protocol used by the connection.
        status:
          $ref: '#/components/schemas/ConnectionStatus'
          description: Current connection health.
      additionalProperties: false
    NodeCreate:
      allOf:
      - $ref: '#/components/schemas/NodeUpdate'
        description: Initial node configuration and upstream input.
    NodeInputUpdate:
      type: object
      required:
      - inputNodeId
      properties:
        inputNodeId:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Upstream node to connect as input. Must have a type included in the
            selected node type's `inputTypes`; use null when the type accepts no input.
    NodeList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Node'
          description: Nodes returned by the query.
        total:
          type: integer
          format: int64
          description: Total number of matching nodes.
          minimum: 0
      additionalProperties: false
    NodeSettingDefinition:
      type: object
      required:
      - key
      - label
      - input
      - valueType
      - required
      properties:
        defaultValue:
          $ref: '#/components/schemas/NodeSettingValue'
          description: Initial value suggested for the setting.
        description:
          type: string
          description: Help text explaining the setting.
        input:
          oneOf:
          - type: string
            enum:
            - text
            - number
            - select
            - checkbox
          description: Form control used to edit the setting.
        key:
          type: string
          description: Property name used in the node's settings object.
          pattern: ^[A-Za-z][A-Za-z0-9]*$
        label:
          type: string
          description: Display label for the setting.
        maximum:
          type: number
          format: double
          description: Inclusive upper bound for a numeric value.
        minimum:
          type: number
          format: double
          description: Inclusive lower bound for a numeric value.
        options:
          type: array
          items:
            $ref: '#/components/schemas/NodeSettingOption'
          description: Available choices for a selection control.
        placeholder:
          type: string
          description: Hint shown when the setting has no value.
        required:
          type: boolean
          description: Whether a value is required for this setting.
        valueType:
          oneOf:
          - type: string
            enum:
            - string
            - integer
            - number
            - boolean
          description: Data type accepted by the setting.
      additionalProperties: false
    NodeSettingOption:
      type: object
      required:
      - value
      - label
      properties:
        label:
          type: string
          description: Display text for this option.
        value:
          $ref: '#/components/schemas/NodeSettingValue'
          description: Setting value submitted when this option is selected.
      additionalProperties: false
    NodeSettingValue:
      oneOf:
      - type: string
      - type: number
        format: double
      - type: boolean
      - type: 'null'
        default: null
      description: A value accepted by a node setting field.
    NodeSettings:
      oneOf:
      - type: object
        required:
        - settings
        - type
        properties:
          settings:
            $ref: '#/components/schemas/AudioSourceSettings'
          type:
            type: string
            enum:
            - audio_source
      - type: object
        required:
        - settings
        - type
        properties:
          settings:
            $ref: '#/components/schemas/TranscriberSettings'
          type:
            type: string
            enum:
            - transcriber
      - type: object
        required:
        - settings
        - type
        properties:
          settings:
            $ref: '#/components/schemas/TranslatorSettings'
          type:
            type: string
            enum:
            - translator
      - type: object
        required:
        - settings
        - type
        properties:
          settings:
            $ref: '#/components/schemas/DisplaySettings'
          type:
            type: string
            enum:
            - display
      description: The node type and its corresponding settings share a single discriminator.
    NodeStatus:
      type: string
      enum:
      - connected
      - disconnected
      - degraded
    NodeType:
      type: string
      enum:
      - audio_source
      - transcriber
      - translator
      - display
    NodeTypeDefinition:
      type: object
      required:
      - type
      - name
      - description
      - inputTypes
      - settings
      properties:
        description:
          type: string
          description: Purpose of this node type.
        inputTypes:
          type: array
          items:
            $ref: '#/components/schemas/NodeType'
          description: Node types that may be selected as this node's upstream input.
        name:
          type: string
          description: Display name of the node type.
        settings:
          type: array
          items:
            $ref: '#/components/schemas/NodeSettingDefinition'
          description: Editable settings supported by this node type.
        type:
          $ref: '#/components/schemas/NodeType'
          description: Node type described by this definition.
      additionalProperties: false
    NodeTypeDefinitionList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeTypeDefinition'
          description: Node type definitions returned by the query.
        total:
          type: integer
          format: int64
          description: Total number of matching node type definitions.
          minimum: 0
      additionalProperties: false
    NodeUpdate:
      allOf:
      - $ref: '#/components/schemas/NodeUpdateBase'
        description: Editable name, description, and enabled state.
      - $ref: '#/components/schemas/NodeSettings'
        description: Node type discriminator and its matching settings.
      - $ref: '#/components/schemas/NodeInputUpdate'
        description: Upstream input selection for the node.
    NodeUpdateBase:
      type: object
      required:
      - name
      - enabled
      properties:
        description:
          type:
          - string
          - 'null'
          description: Optional description of the node’s purpose.
          maxLength: 1000
        enabled:
          type: boolean
          description: Whether the node should run.
        name:
          type: string
          description: Display name shown to users.
          maxLength: 128
          minLength: 1
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        status:
          type: integer
          format: int32
          maximum: 599
          minimum: 400
        title:
          type: string
        type:
          type: string
          format: uri-reference
          default: about:blank
    TranscriberNode:
      allOf:
      - $ref: '#/components/schemas/NodeBase'
        description: Common node identity, configuration, and runtime state.
      - type: object
        required:
        - settings
        properties:
          settings:
            $ref: '#/components/schemas/TranscriberSettings'
            description: Configuration for this node type.
    TranscriberSettings:
      type: object
      required:
      - model
      - language
      properties:
        beamSize:
          type: integer
          format: int32
          description: Number of candidate sequences retained during decoding.
          default: 5
          maximum: 20
          minimum: 1
        language:
          $ref: '#/components/schemas/LanguageTag'
          description: Language code of the incoming speech.
        model:
          type: string
          description: Speech recognition model used to decode audio.
          examples:
          - large-v3
          minLength: 1
        task:
          oneOf:
          - type: string
            enum:
            - transcribe
            - translate
          description: Whether to transcribe speech or translate it into English.
          default: transcribe
        vadEnabled:
          type: boolean
          description: Whether voice activity detection filters out non-speech audio.
          default: true
      additionalProperties: false
    TranslatorNode:
      allOf:
      - $ref: '#/components/schemas/NodeBase'
        description: Common node identity, configuration, and runtime state.
      - type: object
        required:
        - settings
        properties:
          settings:
            $ref: '#/components/schemas/TranslatorSettings'
            description: Configuration for this node type.
    TranslatorSettings:
      type: object
      required:
      - sourceLanguage
      - targetLanguage
      - provider
      properties:
        model:
          type:
          - string
          - 'null'
          description: Translation model override; null selects the provider default.
        preserveFormatting:
          type: boolean
          description: Whether to retain input text formatting in translations.
          default: true
        provider:
          type: string
          description: Translation backend used to process text.
          examples:
          - openai
          minLength: 1
        sourceLanguage:
          $ref: '#/components/schemas/LanguageTag'
          description: Language code of the input text.
        targetLanguage:
          $ref: '#/components/schemas/LanguageTag'
          description: Language code requested for the translated text.
      additionalProperties: false
    User:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
      additionalProperties: false
    ValidationProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: array
            items:
              type: object
              required:
              - path
              - message
              properties:
                message:
                  type: string
                path:
                  type: string
                  examples:
                  - settings.language
              additionalProperties: false
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: A valid bearer token is required.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: One or more fields failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
security:
- bearerAuth: []

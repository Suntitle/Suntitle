openapi: 3.1.0
info:
  title: Suntitle Control API
  description: Resource-oriented control API. Successful writes persist desired state; runtime application is asynchronous. Kubernetes schema/CEL validate specs; API-server errors preserve their HTTP status, reason, message, and details.
  version: 0.1.0
servers:
- url: /api/v1
  description: API version 1
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Log in
      description: Exchange user credentials for a bearer access token.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out
      description: Revoke the bearer token used for this request.
      operationId: logout
      responses:
        '204':
          description: Logout successful.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Get the authenticated user
      description: Validates the bearer token and returns its user. A missing, expired, revoked, or otherwise invalid token returns `401 Unauthorized`.
      operationId: getCurrentUser
      responses:
        '200':
          description: The bearer token is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /extensions:
    get:
      tags:
      - Extensions
      summary: List registered extensions
      operationId: listExtensions
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_SuntitleExtension'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
      - Extensions
      summary: Register an extension
      description: Register from a source manifest or an explicit specification. Source registration reads manifest.yaml, manifest.yml, or manifest.json and overrides manifest source fields with the selected source. Publication and host installation remain asynchronous.
      operationId: createExtension
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionCreateRequest'
        required: true
      responses:
        '201':
          description: ''
          headers:
            Location:
              schema:
                type: string
              description: Created extension URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuntitleExtension'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /extensions/{name}:
    get:
      tags:
      - Extensions
      operationId: getExtension
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuntitleExtension'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /extensions/{name}/refresh:
    post:
      tags:
      - Extensions
      summary: Request extension preparation from its source
      description: Persist a fresh refresh token. Preparation is asynchronous; pending requests may coalesce. Stored publication status may describe an older generation.
      operationId: refreshExtension
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuntitleExtension'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /hosts:
    get:
      tags:
      - Hosts
      operationId: listHosts
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_SuntitleHost'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /hosts/{hostUid}/nodes:
    post:
      tags:
      - Nodes
      description: Persist desired state with host ownership. The path selects the host by metadata.uid. Hosts are listed on each request to resolve its name. Success does not imply runtime execution.
      operationId: installNodeOnHost
      parameters:
      - name: hostUid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreate'
        required: true
      responses:
        '201':
          description: ''
          headers:
            Location:
              schema:
                type: string
              description: Created resource URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuntitleNode'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /node-types:
    get:
      tags:
      - Node types
      summary: List installable node types
      description: Returns the node types supported by the control plane and the field metadata needed to configure their type-specific settings.
      operationId: listNodeTypes
      responses:
        '200':
          description: Installable node types and their setting definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeTypeDefinitionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /nodes:
    get:
      tags:
      - Nodes
      operationId: listNodes
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList_SuntitleNode'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /nodes/{name}:
    get:
      tags:
      - Nodes
      operationId: getNode
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuntitleNode'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags:
      - Nodes
      description: Persist a complete desired spec without a resourceVersion precondition. Status is preserved. Success does not imply runtime application.
      operationId: updateNode
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdate'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuntitleNode'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags:
      - Nodes
      description: Request asynchronous removal. Terminating resources remain visible until runtime cleanup is acknowledged, including while the host is offline.
      operationId: deleteNode
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Deletion requested
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /nodes/{name}/restart:
    post:
      tags:
      - Nodes
      description: Persist a fresh restart token. Runtime completion is asynchronous; pending requests may coalesce.
      operationId: restartNode
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuntitleNode'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    AudioSourceSettings:
      type: object
      required:
      - sampleRateHz
      - channels
      - encoding
      properties:
        channels:
          type: integer
          format: int32
          description: Number of audio channels captured.
          maximum: 2
          minimum: 1
        deviceName:
          type:
          - string
          - 'null'
          description: Audio capture device; null selects the runtime default.
          maxLength: 256
        encoding:
          oneOf:
          - type: string
            enum:
            - pcm_s16le
            - pcm_f32le
            - opus
          description: Format used to encode captured audio.
        sampleRateHz:
          type: integer
          enum:
          - 8000
          - 16000
          - 22050
          - 44100
          - 48000
      additionalProperties: false
    DisplaySettings:
      type: object
      required:
      - maxLines
      - fontScale
      - showOriginal
      properties:
        fontScale:
          type: number
          format: double
          description: Multiplier applied to the default subtitle font size.
          maximum: 4
          minimum: 0.5
        maxLines:
          type: integer
          format: int32
          description: Maximum number of subtitle lines displayed at once.
          maximum: 10
          minimum: 1
        showOriginal:
          type: boolean
          description: Whether to show source text alongside its translation.
        theme:
          oneOf:
          - type: string
            enum:
            - light
            - dark
            - transparent
          description: Color and background style used for subtitles.
          default: dark
      additionalProperties: false
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        details: {}
        message:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ExtensionCreate:
      type: object
      required:
      - spec
      properties:
        name:
          type:
          - string
          - 'null'
        spec:
          $ref: '#/components/schemas/SuntitleExtensionSpec'
      additionalProperties: false
    ExtensionCreateRequest:
      oneOf:
      - $ref: '#/components/schemas/ExtensionRegistration'
        description: Resolve configuration from the selected source before persistence.
      - $ref: '#/components/schemas/ExtensionCreate'
        description: Preserve callers that already provide the complete specification.
      description: Registration accepts a source manifest or an explicit extension specification.
    ExtensionRegistration:
      type: object
      description: Registration location; all adapter fields come from the source manifest.
      required:
      - sourceType
      - source
      properties:
        source:
          type: string
          description: Absolute server directory, HTTP(S) Git URL, OCI reference, or HTTP payload URL.
          minLength: 1
        sourceType:
          $ref: '#/components/schemas/ExtensionSourceType'
          description: Transport used to read and subsequently publish the extension.
      additionalProperties: false
    ExtensionSourceType:
      type: string
      description: Transport used to discover and publish extension payloads.
      enum:
      - local
      - git
      - oci
      - http
    LanguageTag:
      type: string
      description: BCP 47 language tag.
      examples:
      - en
      - en-US
      pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
          format: password
          maxLength: 1024
          minLength: 1
        username:
          type: string
          maxLength: 128
          minLength: 1
      additionalProperties: false
    LoginResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
          description: Value to use with the `Authorization` header.
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds.
          minimum: 1
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'
      additionalProperties: false
    NodeCreate:
      type: object
      required:
      - spec
      properties:
        name:
          type:
          - string
          - 'null'
        spec:
          $ref: '#/components/schemas/SuntitleNodeSpec'
      additionalProperties: false
    NodeSettingDefinition:
      type: object
      required:
      - key
      - label
      - input
      - valueType
      - required
      properties:
        defaultValue:
          $ref: '#/components/schemas/NodeSettingValue'
          description: Initial value suggested for the setting.
        description:
          type: string
          description: Help text explaining the setting.
        input:
          oneOf:
          - type: string
            enum:
            - text
            - number
            - select
            - checkbox
          description: Form control used to edit the setting.
        key:
          type: string
          description: Property name used in the node's settings object.
          pattern: ^[A-Za-z][A-Za-z0-9]*$
        label:
          type: string
          description: Display label for the setting.
        maximum:
          type: number
          format: double
          description: Inclusive upper bound for a numeric value.
        minimum:
          type: number
          format: double
          description: Inclusive lower bound for a numeric value.
        options:
          type: array
          items:
            $ref: '#/components/schemas/NodeSettingOption'
          description: Available choices for a selection control.
        placeholder:
          type: string
          description: Hint shown when the setting has no value.
        required:
          type: boolean
          description: Whether a value is required for this setting.
        valueType:
          oneOf:
          - type: string
            enum:
            - string
            - integer
            - number
            - boolean
          description: Data type accepted by the setting.
      additionalProperties: false
    NodeSettingOption:
      type: object
      required:
      - value
      - label
      properties:
        label:
          type: string
          description: Display text for this option.
        value:
          $ref: '#/components/schemas/NodeSettingValue'
          description: Setting value submitted when this option is selected.
      additionalProperties: false
    NodeSettingValue:
      oneOf:
      - type: string
      - type: number
        format: double
      - type: boolean
      - type: 'null'
        default: null
      description: A value accepted by a node setting field.
    NodeType:
      type: string
      enum:
      - audio_source
      - transcriber
      - translator
      - display
    NodeTypeDefinition:
      type: object
      required:
      - type
      - name
      - description
      - inputTypes
      - settings
      properties:
        description:
          type: string
          description: Purpose of this node type.
        inputTypes:
          type: array
          items:
            $ref: '#/components/schemas/NodeType'
          description: Node types that may be selected as this node's upstream input.
        name:
          type: string
          description: Display name of the node type.
        settings:
          type: array
          items:
            $ref: '#/components/schemas/NodeSettingDefinition'
          description: Editable settings supported by this node type.
        type:
          $ref: '#/components/schemas/NodeType'
          description: Node type described by this definition.
      additionalProperties: false
    NodeTypeDefinitionList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeTypeDefinition'
          description: Node type definitions returned by the query.
        total:
          type: integer
          format: int64
          description: Total number of matching node type definitions.
          minimum: 0
      additionalProperties: false
    NodeUpdate:
      type: object
      required:
      - spec
      properties:
        spec:
          $ref: '#/components/schemas/SuntitleNodeSpec'
      additionalProperties: false
    ResourceList_SuntitleExtension:
      type: object
      required:
      - items
      - resourceVersion
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SuntitleExtension'
        resourceVersion:
          type: string
    ResourceList_SuntitleHost:
      type: object
      required:
      - items
      - resourceVersion
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SuntitleHost'
        resourceVersion:
          type: string
    ResourceList_SuntitleNode:
      type: object
      required:
      - items
      - resourceVersion
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SuntitleNode'
        resourceVersion:
          type: string
    SuntitleExtension:
      type: object
      title: SuntitleExtension
      description: Auto-generated derived type for SuntitleExtensionSpec via `CustomResource`
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - control.suntitle.io/v1alpha1
        kind:
          type: string
          enum:
          - SuntitleExtension
        metadata:
          type: object
          title: io.k8s.apimachinery.pkg.apis.meta.v1.ObjectMeta
          description: ObjectMeta is metadata that all persisted resources must have, which includes all objects users must create.
          properties:
            annotations:
              type: object
              description: 'Annotations is an unstructured key value map stored with a resource that may be set by external tools to store and retrieve arbitrary metadata. They are not queryable and should be preserved when modifying objects. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations'
              additionalProperties:
                type: string
            creationTimestamp:
              type: string
              format: date-time
              description: |-
                CreationTimestamp is a timestamp representing the server time when this object was created. It is not guaranteed to be set in happens-before order across separate operations. Clients may not set this value. It is represented in RFC3339 form and is in UTC.

                Populated by the system. Read-only. Null for lists. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
            deletionGracePeriodSeconds:
              type: integer
              format: int64
              description: Number of seconds allowed for this object to gracefully terminate before it will be removed from the system. Only set when deletionTimestamp is also set. May only be shortened. Read-only.
            deletionTimestamp:
              type: string
              format: date-time
              description: |-

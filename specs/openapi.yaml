openapi: 3.1.0
info:
  title: Suntitle Control API
  description: |
    API for authenticating operators and managing hosts and nodes in the live
    subtitle pipeline. Connection topology is represented by the `connections`
    field of each node; there is intentionally no separate routes resource.
  version: 0.1.0
servers:
- url: /api/v1
  description: API version 1
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Log in
      description: Exchange user credentials for a bearer access token.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out
      description: Revoke the bearer token used for this request.
      operationId: logout
      responses:
        '204':
          description: Logout successful.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Get the authenticated user
      description: Validates the bearer token and returns its user. A missing, expired, revoked, or otherwise invalid token returns `401 Unauthorized`.
      operationId: getCurrentUser
      responses:
        '200':
          description: The bearer token is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /hosts:
    get:
      tags:
      - Hosts
      summary: List hosts
      description: Returns hosts running one or more pipeline nodes, including their IP and software version.
      operationId: listHosts
      parameters:
      - name: status
        in: query
        description: Return only hosts with this status.
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HostStatus'
      responses:
        '200':
          description: Known hosts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /hosts/{hostId}/nodes:
    post:
      tags:
      - Nodes
      summary: Install a node on a host
      description: Installs a configured pipeline node on the selected host. The request `type` and `settings` must match one of the definitions returned by `GET /node-types`.
      operationId: installNodeOnHost
      parameters:
      - name: hostId
        in: path
        description: Host that should install and run the node.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreate'
        required: true
      responses:
        '201':
          description: Node installation was accepted and the node was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /node-types:
    get:
      tags:
      - Node types
      summary: List installable node types
      description: Returns the node types supported by the control plane and the field metadata needed to configure their type-specific settings.
      operationId: listNodeTypes
      responses:
        '200':
          description: Installable node types and their setting definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeTypeDefinitionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /nodes:
    get:
      tags:
      - Nodes
      summary: List connected nodes and their connections
      description: Returns nodes currently known by the backend. Each node includes its type, nested host, type-specific settings, and links to peer nodes.
      operationId: listNodes
      parameters:
      - name: type
        in: query
        description: Return only nodes of this type.
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NodeType'
      - name: status
        in: query
        description: Return only nodes with this status.
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NodeStatus'
      responses:
        '200':
          description: Nodes and their connection topology.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /nodes/{nodeId}:
    get:
      tags:
      - Nodes
      summary: Get a node
      operationId: getNode
      parameters:
      - name: nodeId
        in: path
        description: Unique node identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Node details and connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Nodes
      summary: Replace editable node information and settings
      description: Replaces operator-managed fields. The request `type` and `settings` must match the node's existing type. `inputNodeId` selects an upstream node whose type is allowed by the node type's `inputTypes`. ID, type, host, status, outgoing connection topology, and timestamps are server-managed.
      operationId: updateNode
      parameters:
      - name: nodeId
        in: path
        description: Unique node identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdate'
        required: true
      responses:
        '200':
          description: Updated node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request type conflicts with the existing node type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /nodes/{nodeId}/restart:
    post:
      tags:
      - Nodes
      summary: Restart a node
      description: Restarts the selected node while preserving its configuration and connections.
      operationId: restartNode
      parameters:
      - name: nodeId
        in: path
        description: Unique node identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Restarted node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The node cannot be restarted in its current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    AudioSourceNode:
      allOf:
      - $ref: '#/components/schemas/NodeBase'
      - $ref: '#/components/schemas/AudioSourceVariant'
    AudioSourceNodeCreate:
      allOf:
      - $ref: '#/components/schemas/NodeUpdateBase'
      - $ref: '#/components/schemas/AudioSourceVariant'
    AudioSourceNodeUpdate:
      allOf:
      - $ref: '#/components/schemas/NodeUpdateBase'
      - $ref: '#/components/schemas/AudioSourceVariant'
      - $ref: '#/components/schemas/NodeInputUpdate'
    AudioSourceSettings:
      type: object
      required:
      - sampleRateHz
      - channels
      - encoding
      properties:
        channels:
          type: integer
          format: int32
          maximum: 2
          minimum: 1
        deviceName:
          type:
          - string
          - 'null'
          maxLength: 256
        encoding:
          type: string
          enum:
          - pcm_s16le
          - pcm_f32le
          - opus
        sampleRateHz:
          type: integer
          enum:
          - 8000
          - 16000
          - 22050
          - 44100
          - 48000
      additionalProperties: false
    AudioSourceVariant:
      type: object
      required:
      - type
      - settings
      properties:
        settings:
          $ref: '#/components/schemas/AudioSourceSettings'
        type:
          $ref: '#/components/schemas/NodeType'
    ConnectionStatus:
      type: string
      enum:
      - connected
      - reconnecting
      - degraded
    DataType:
      type: string
      description: Type of data transferred over a node connection.
      enum:
      - audio
      - transcription
      - translation
    DisplayNode:
      allOf:
      - $ref: '#/components/schemas/NodeBase'
      - $ref: '#/components/schemas/DisplayVariant'
    DisplayNodeCreate:
      allOf:
      - $ref: '#/components/schemas/NodeUpdateBase'
      - $ref: '#/components/schemas/DisplayVariant'
    DisplayNodeUpdate:
      allOf:
      - $ref: '#/components/schemas/NodeUpdateBase'
      - $ref: '#/components/schemas/DisplayVariant'
      - $ref: '#/components/schemas/NodeInputUpdate'
    DisplaySettings:
      type: object
      required:
      - maxLines
      - fontScale
      - showOriginal
      properties:
        fontScale:
          type: number
          format: double
          maximum: 4
          minimum: 0.5
        maxLines:
          type: integer
          format: int32
          maximum: 10
          minimum: 1
        showOriginal:
          type: boolean
        theme:
          oneOf:
          - type: string
            enum:
            - light
            - dark
            - transparent
          default: dark
      additionalProperties: false
    DisplayVariant:
      type: object
      required:
      - type
      - settings
      properties:
        settings:
          $ref: '#/components/schemas/DisplaySettings'
        type:
          $ref: '#/components/schemas/NodeType'
    Host:
      type: object
      required:
      - id
      - name
      - ip
      - version
      - status
      - lastSeenAt
      properties:
        id:
          type: string
          format: uuid
        ip:
          type: string
          format: ip
          examples:
          - 192.0.2.10
          - 2001:db8::10
        lastSeenAt:
          type: string
          format: date-time
        metadata:
          type: object
          description: Optional host capabilities or implementation-specific information.
          additionalProperties: true
        name:
          type: string
          maxLength: 128
          minLength: 1
        status:
          $ref: '#/components/schemas/HostStatus'
        version:
          type: string
          description: Version of the Suntitle host agent or runtime.
          examples:
          - 0.1.0
          minLength: 1
      additionalProperties: false
    HostList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Host'
        total:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    HostStatus:
      type: string
      enum:
      - online
      - offline
      - degraded
    LanguageTag:
      type: string
      description: BCP 47 language tag.
      examples:
      - en
      - en-US
      pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
          format: password
          maxLength: 1024
          minLength: 1
        username:
          type: string
          maxLength: 128
          minLength: 1
      additionalProperties: false
    LoginResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
          description: Value to use with the `Authorization` header.
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds.
          minimum: 1
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'
      additionalProperties: false
    Node:
      oneOf:
      - $ref: '#/components/schemas/AudioSourceNode'
      - $ref: '#/components/schemas/TranscriberNode'
      - $ref: '#/components/schemas/TranslatorNode'
      - $ref: '#/components/schemas/DisplayNode'
      discriminator:
        propertyName: type
        mapping:
          audio_source: '#/components/schemas/AudioSourceNode'
          display: '#/components/schemas/DisplayNode'
          transcriber: '#/components/schemas/TranscriberNode'
          translator: '#/components/schemas/TranslatorNode'
    NodeBase:
      type: object
      required:
      - id
      - type
      - name
      - enabled
      - status
      - host
      - connections
      - createdAt
      - updatedAt
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/NodeConnection'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        description:
          type:
          - string
          - 'null'
          maxLength: 1000
        enabled:
          type: boolean
        host:
          $ref: '#/components/schemas/Host'
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 128
          minLength: 1
        status:
          $ref: '#/components/schemas/NodeStatus'
        type:
          $ref: '#/components/schemas/NodeType'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    NodeConnection:
      type: object
      required:
      - id
      - peerNodeId
      - peerNodeType
      - direction
      - dataType
      - status
      - protocol
      - connectedAt
      - lastActivityAt
      properties:
        bytesTransferred:
          type: integer
          format: int64
          minimum: 0
        connectedAt:
          type: string
          format: date-time
        dataType:
          $ref: '#/components/schemas/DataType'
        direction:
          type: string
          enum:
          - incoming
          - outgoing
        id:
          type: string
          format: uuid
          description: Stable identifier of this connection.
        lastActivityAt:
          type: string
          format: date-time
        metadata:
          type: object
          description: Optional implementation-specific connection information.
          additionalProperties: true
        peerName:
          type: string
        peerNodeId:
          type: string
          format: uuid
        peerNodeType:
          $ref: '#/components/schemas/NodeType'
        protocol:
          type: string
          enum:
          - websocket
          - http
          - https
        status:
          $ref: '#/components/schemas/ConnectionStatus'
      additionalProperties: false
    NodeCreate:
      oneOf:
      - $ref: '#/components/schemas/AudioSourceNodeCreate'
      - $ref: '#/components/schemas/TranscriberNodeCreate'
      - $ref: '#/components/schemas/TranslatorNodeCreate'
      - $ref: '#/components/schemas/DisplayNodeCreate'
      discriminator:
        propertyName: type
        mapping:
          audio_source: '#/components/schemas/AudioSourceNodeCreate'
          display: '#/components/schemas/DisplayNodeCreate'
          transcriber: '#/components/schemas/TranscriberNodeCreate'
          translator: '#/components/schemas/TranslatorNodeCreate'
    NodeInputUpdate:
      type: object
      required:
      - inputNodeId
      properties:
        inputNodeId:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Upstream node to connect as input. Must have a type included in the
            selected node type's `inputTypes`; use null when the type accepts no input.
    NodeList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        total:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    NodeSettingDefinition:
      type: object
      required:
      - key
      - label
      - input
      - valueType
      - required
      properties:
        defaultValue:
          $ref: '#/components/schemas/NodeSettingValue'
        description:
          type: string
        input:
          type: string
          enum:
          - text
          - number
          - select
          - checkbox
        key:
          type: string
          description: Property name used in the node's settings object.
          pattern: ^[A-Za-z][A-Za-z0-9]*$
        label:
          type: string
        maximum:
          type: number
          format: double
        minimum:
          type: number
          format: double
        options:
          type: array
          items:
            $ref: '#/components/schemas/NodeSettingOption'
        placeholder:
          type: string
        required:
          type: boolean
        valueType:
          type: string
          enum:
          - string
          - integer
          - number
          - boolean
      additionalProperties: false
    NodeSettingOption:
      type: object
      required:
      - value
      - label
      properties:
        label:
          type: string
        value:
          $ref: '#/components/schemas/NodeSettingValue'
      additionalProperties: false
    NodeSettingValue:
      oneOf:
      - type: string
      - type: number
        format: double
      - type: boolean
      - type: 'null'
        default: null
      description: A value accepted by a node setting field.
    NodeStatus:
      type: string
      enum:
      - connected
      - disconnected
      - degraded
    NodeType:
      type: string
      enum:
      - audio_source
      - transcriber
      - translator
      - display
    NodeTypeDefinition:
      type: object
      required:
      - type
      - name
      - description
      - inputTypes
      - settings
      properties:
        description:
          type: string
        inputTypes:
          type: array
          items:
            $ref: '#/components/schemas/NodeType'
          description: Node types that may be selected as this node's upstream input.
        name:
          type: string
        settings:
          type: array
          items:
            $ref: '#/components/schemas/NodeSettingDefinition'
        type:
          $ref: '#/components/schemas/NodeType'
      additionalProperties: false
    NodeTypeDefinitionList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeTypeDefinition'
        total:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    NodeUpdate:
      oneOf:
      - $ref: '#/components/schemas/AudioSourceNodeUpdate'
      - $ref: '#/components/schemas/TranscriberNodeUpdate'
      - $ref: '#/components/schemas/TranslatorNodeUpdate'
      - $ref: '#/components/schemas/DisplayNodeUpdate'
      discriminator:
        propertyName: type
        mapping:
          audio_source: '#/components/schemas/AudioSourceNodeUpdate'
          display: '#/components/schemas/DisplayNodeUpdate'
          transcriber: '#/components/schemas/TranscriberNodeUpdate'
          translator: '#/components/schemas/TranslatorNodeUpdate'
    NodeUpdateBase:
      type: object
      required:
      - type
      - name
      - enabled
      properties:
        description:
          type:
          - string
          - 'null'
          maxLength: 1000
        enabled:
          type: boolean
        name:
          type: string
          maxLength: 128
          minLength: 1
        type:
          $ref: '#/components/schemas/NodeType'
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        status:
          type: integer
          format: int32
          maximum: 599
          minimum: 400
        title:
          type: string
        type:
          type: string
          format: uri-reference
          default: about:blank
    TranscriberNode:
      allOf:
      - $ref: '#/components/schemas/NodeBase'
      - $ref: '#/components/schemas/TranscriberVariant'
    TranscriberNodeCreate:
      allOf:
      - $ref: '#/components/schemas/NodeUpdateBase'
      - $ref: '#/components/schemas/TranscriberVariant'
    TranscriberNodeUpdate:
      allOf:
      - $ref: '#/components/schemas/NodeUpdateBase'
      - $ref: '#/components/schemas/TranscriberVariant'
      - $ref: '#/components/schemas/NodeInputUpdate'
    TranscriberSettings:
      type: object
      required:
      - model
      - language
      properties:
        beamSize:
          type: integer
          format: int32
          default: 5
          maximum: 20
          minimum: 1
        language:
          $ref: '#/components/schemas/LanguageTag'
        model:
          type: string
          examples:
          - large-v3
          minLength: 1
        task:
          oneOf:
          - type: string
            enum:
            - transcribe
            - translate
          default: transcribe
        vadEnabled:
          type: boolean
          default: true
      additionalProperties: false
    TranscriberVariant:
      type: object
      required:
      - type
      - settings
      properties:
        settings:
          $ref: '#/components/schemas/TranscriberSettings'
        type:
          $ref: '#/components/schemas/NodeType'
    TranslatorNode:
      allOf:
      - $ref: '#/components/schemas/NodeBase'
      - $ref: '#/components/schemas/TranslatorVariant'
    TranslatorNodeCreate:
      allOf:
      - $ref: '#/components/schemas/NodeUpdateBase'
      - $ref: '#/components/schemas/TranslatorVariant'
    TranslatorNodeUpdate:
      allOf:
      - $ref: '#/components/schemas/NodeUpdateBase'
      - $ref: '#/components/schemas/TranslatorVariant'
      - $ref: '#/components/schemas/NodeInputUpdate'
    TranslatorSettings:
      type: object
      required:
      - sourceLanguage
      - targetLanguage
      - provider
      properties:
        model:
          type:
          - string
          - 'null'
        preserveFormatting:
          type: boolean
          default: true
        provider:
          type: string
          examples:
          - openai
          minLength: 1
        sourceLanguage:
          $ref: '#/components/schemas/LanguageTag'
        targetLanguage:
          $ref: '#/components/schemas/LanguageTag'
      additionalProperties: false
    TranslatorVariant:
      type: object
      required:
      - type
      - settings
      properties:
        settings:
          $ref: '#/components/schemas/TranslatorSettings'
        type:
          $ref: '#/components/schemas/NodeType'
    User:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
      additionalProperties: false
    ValidationProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: array
            items:
              type: object
              required:
              - path
              - message
              properties:
                message:
                  type: string
                path:
                  type: string
                  examples:
                  - settings.language
              additionalProperties: false
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: A valid bearer token is required.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: One or more fields failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
security:
- bearerAuth: []
tags:
- name: Authentication
- name: Hosts
- name: Node types
- name: Nodes

[workspace]
resolver = "3"
members = ["ws-proxy", "control-api", "diamant", "diamant-ui", "oci-artifact", "suntitle-core"]
default-members = ["ws-proxy", "control-api", "diamant", "oci-artifact", "suntitle-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
suntitle-core = { path = "suntitle-core" }
control-api = { path = "control-api" }
apalis = { version = "=1.0.0", default-features = false, features = ["limit", "catch-panic"] }
apalis-sqlite = "=1.0.0"
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "blocking-http-transport-reqwest-rust-tls"] }
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
tokio-util = { version = "0.7", features = ["io", "io-util", "rt"] }
tar = "0.4"
flate2 = "1"
oci-artifact = { path = "oci-artifact" }
oci-client = { version = "0.18", default-features = false }
oci-spec = { version = "0.10", default-features = false, features = ["image"] }
ocirender = "=0.3.0"
xz2 = { version = "0.1", features = ["static"] }
backon = "1.6"
thiserror = "2"
dirs = "7"
tempfile = "3"
kube = { version = "5.0", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "derive", "runtime", "unstable-runtime", "cel"] }
k8s-openapi = { version = "0.29", features = ["v1_36", "schemars"] }
schemars = { version = "1", features = ["chrono04"] }
uv  = "0.12.21"
actix-web = "4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
diamant-ui = { path = "diamant-ui" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
futures-util = "0.3.34"
hostname = "0.4"
ctrlc = { version = "3", features = ["termination"] }
nix = { version = "0.31", features = ["signal", "process"] }
pretty_env_logger = "0.5.0"
rootcause = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "5.0"
serde_yaml = "0.9"
tokio = { version = "1.54.1", features = ["full"]}
tokio-stream = "0.1.19"
tokio-tungstenite = "0.30.0"
utoipa = { version = "6", features = ["actix_extras", "chrono", "uuid", "yaml"] }
utoipa-actix-web = "0.2"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
validator = { version = "0.21", features = ["derive"] }
warp = { version = "0.4.3", features = ["websocket", "server"] }
clap_reverse = "0.1.1"

[profile.dev]
debug = 0

[profile.test]
debug = 0

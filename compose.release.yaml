# Deployment uses separate component images built from release binaries.
services:
  kubernetes-bootstrap:
    build: &release-build
      context: .
      dockerfile: docker/ws-proxy/Dockerfile.release
      target: control-api
      args:
        SUNTITLE_RELEASE_VERSION: ${SUNTITLE_RELEASE_VERSION:?Set a pinned Suntitle release tag}
        SUNTITLE_RELEASE_REPOSITORY: ${SUNTITLE_RELEASE_REPOSITORY:?Set the GitHub release repository}
    image: suntitle-control-api:${SUNTITLE_RELEASE_VERSION}
  api:
    image: suntitle-control-api:${SUNTITLE_RELEASE_VERSION}
  ws-proxy:
    build:
      <<: *release-build
      target: ws-proxy
    image: suntitle-ws-proxy:${SUNTITLE_RELEASE_VERSION}

# Deployment pulls images; local Compose retains its source builds.
services:
  kubernetes-bootstrap:
    build: !reset null
    image: ${SUNTITLE_API_IMAGE:?Set the control API image}
  api:
    image: ${SUNTITLE_API_IMAGE:?Set the control API image}
  ws-proxy:
    build: !reset null
    image: ${SUNTITLE_PROXY_IMAGE:?Set the WebSocket proxy image}
  ui:
    build: !reset null
    image: ${SUNTITLE_UI_IMAGE:?Set the UI image}

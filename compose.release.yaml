# Deployment pulls images; local Compose retains its source builds.
services:
  kubernetes-bootstrap:
    build: !reset null
    image: ${API_IMAGE:?Set the control API image}
  api:
    image: ${API_IMAGE:?Set the control API image}
  ws-proxy:
    build: !reset null
    image: ${PROXY_IMAGE:?Set the WebSocket proxy image}
  ui:
    build: !reset null
    image: ${UI_IMAGE:?Set the UI image}

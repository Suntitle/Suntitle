[package]
name = "oci-artifact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[features]
default = ["rust-tls"]
rust-tls = ["oci-client/rustls-tls"]
native-tls = ["oci-client/native-tls"]

[dependencies]
oci-client = { version = "0.18", default-features = false }
oci-spec = { version = "0.10", default-features = false, features = ["image"] }
ocirender = "=0.3.0"
xz2 = { version = "0.1", features = ["static"] }
backon = "1.6"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt", "io", "io-util"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
sha2 = "0.10"

[dev-dependencies]
tar = "0.4"
flate2 = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
